apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-app
  namespace: target-apps
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos-app
  template:
    metadata:
      annotations:
        atienel.io/deployment: chaos-app
      labels:
        app.kubernetes.io/name: chaos-app
        atienel.io/http-metrics: "true"
    spec:
      serviceAccountName: chaos-app
      automountServiceAccountToken: false
      containers:
      - name: chaos-app
        image: atienel-chaos-app:phase2
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        env:
        - name: HTTP_FAULT_ENABLED
          value: "true"
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-app
  namespace: target-apps
spec:
  selector:
    app.kubernetes.io/name: chaos-app
  ports:
  - name: http
    port: 8080
    targetPort: http
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-api
  namespace: aiops-core
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-api
    spec:
      serviceAccountName: aiops-api
      automountServiceAccountToken: false
      containers:
      - name: aiops-api
        image: atienel-aiops-api:phase2
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
        env:
        - name: DB_USER
          value: "atienel_api"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-storage
              key: postgres
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-storage
              key: valkey
        - name: INGEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-tokens
              key: ingest
        - name: READER_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-tokens
              key: reader
        - name: APPROVER_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-tokens
              key: approver
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-api
  namespace: aiops-core
spec:
  selector:
    app.kubernetes.io/name: aiops-api
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-reconciler
  namespace: aiops-core
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-reconciler
    spec:
      serviceAccountName: outbox-reconciler
      automountServiceAccountToken: false
      containers:
      - name: outbox-reconciler
        image: atienel-aiops-api:phase2
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        command: ["python", "-m", "src.reconciler"]
        env:
        - name: DB_USER
          value: "atienel_reconciler"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reconciler-storage
              key: postgres
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reconciler-storage
              key: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-watcher
  namespace: aiops-core
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-watcher
    spec:
      serviceAccountName: event-watcher
      automountServiceAccountToken: true
      containers:
      - name: event-watcher
        image: atienel-event-watcher:phase2
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: INGEST_URL
          value: "http://aiops-api:8000/incidents"
        - name: INGEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: watcher-token
              key: ingest

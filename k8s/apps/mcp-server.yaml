apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: aiops-core
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
    spec:
      serviceAccountName: mcp-server
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
      volumes:
      - name: tls
        secret:
          secretName: mcp-server-tls
          defaultMode: 0440
      containers:
      - name: mcp-server
        image: atienel-mcp-server:phase3
        imagePullPolicy: Never
        ports:
        - name: https
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        env:
        - name: DB_USER
          value: atienel_mcp
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mcp-db
              key: password
        - name: MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-access
              key: token
        startupProbe:
          httpGet: &health
            path: /healthz
            port: https
            scheme: HTTPS
            httpHeaders:
            - name: Host
              value: mcp-server.aiops-core.svc:8000
          periodSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet: *health
        readinessProbe:
          httpGet:
            <<: *health
            path: /readyz
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: aiops-core
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
  - name: https
    port: 8000
    targetPort: https

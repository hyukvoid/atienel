apiVersion: batch/v1
kind: Job
metadata:
  generateName: seed-runbooks-
  namespace: aiops-data
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-runbooks
    spec:
      serviceAccountName: seed-runbooks
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: seed
        image: atienel-mcp-server:phase3
        imagePullPolicy: Never
        command: ["python", "-m", "src.seed_runbooks"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: DB_USER
          value: atienel_seed
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-credentials
              key: seed

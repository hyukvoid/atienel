apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-control-egress
  namespace: target-apps
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - chaos-app
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: target-apps
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - chaos-oom-fixture
          - chaos-crash-fixture
    ports:
    - protocol: TCP
      port: 8080

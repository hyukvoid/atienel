apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-api-egress
  namespace: aiops-core
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - mcp-server
      - event-watcher
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: KUBERNETES_SERVICE_IP/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: KUBERNETES_NODE_IP/32
    ports:
    - protocol: TCP
      port: 6443
